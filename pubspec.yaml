name: coi_pond
description: "Control Over Individual Privacy Organization Networking & Data"
version: 1.0.2+2
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter (Google)
  cloud_firestore: ^7.2.0
  cloud_functions: ^7.1.0
  firebase_app_check: ^0.5.2
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6

  # Community
  provider: ^6.1.5+1

  # Local
  ywt_private:
    path: ../ywt_private
  open_ui:
    path: ../open_ui

  # Modules
  presents:
    path: ../presents

  example:
    path: ../open_ui/example

  sos:
    path: ../sos

  a11how:
    path: ../a11how

  # krotos_chronus:
  #   path: ../krotos_chronus

  # wyrd_web:
  #   path: ../wyrd_web

  # smoke_signal:
  #   path: ../smoke_signal

  # ojnt:
  #   path: ../ojnt

dev_dependencies:
  dependency_validator: ^5.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/app-icon.png

flutter_launcher_icons:
  image_path: assets/app-icon.png
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_background: "#A520DA"
  android: true
  ios: true
  background_color_ios: "#A520DA"
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#A520DA"
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  image: assets/app-icon.png
  image_dark: assets/app-icon.png
  color: "#A520DA"
  color_dark: "#A520DA"
  android: true
  ios: true
  web: true
